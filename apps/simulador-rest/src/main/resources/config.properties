# API REST de Flowable (Flowable UI 6.8)
rest.baseUrl=http://localhost:8080/flowable-ui/process-api
rest.username=admin
rest.password=test
rest.connectTimeoutMs=5000
rest.requestTimeoutMs=15000

# Proceso que administra el simulador
process.definitionKey=Process_Curso

# Nombres reales de las suscripciones de mensaje en el motor.
# Ojo: Flowable usa el atributo "name" del elemento <message>, no el
# valor de flowable:messageExpression (ese solo se usa si no hay messageRef).
message.accept=Aceptación
message.reject=Rechazo
message.modify=Solicitud de modificaciones
message.cancel=cancelacionMsg

# Actividad receiveTask que se completa con signal para la nomina
activity.nomina=Nomina
